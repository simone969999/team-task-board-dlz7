
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Task Board</title>
  <style>
    :root {
      --bg-body: #0a1929;
      --bg-header-border: #1976d2;
      --bg-category: #132f4c;
      --bg-task: #1e3a5f;
      --bg-task-hover: #244b7a;
      --bg-summary-card: #132f4c;
      --border-category: #1e4976;
      --text-primary: #fff;
      --text-secondary: #90caf9;
      --text-accent: #64b5f6;
      --text-heading: #64b5f6;
      --shadow-color: rgba(0,0,0,0.3);
      --btn-bg: rgba(255,255,255,0.1);
      --btn-hover: rgba(255,255,255,0.25);
      --footer-color: rgba(144, 202, 249, 0.4);
      --dive-deep-bg: linear-gradient(90deg, #b71c1c 0%, #d32f2f 100%);
      --dive-deep-text: #fff;
    }
    body.light-mode {
      --bg-body: #f5f7fa;
      --bg-category: #ffffff;
      --bg-task: #f0f4f8;
      --bg-task-hover: #e3f2fd;
      --bg-summary-card: #ffffff;
      --border-category: #e0e0e0;
      --text-primary: #263238;
      --text-secondary: #546e7a;
      --text-accent: #1976d2;
      --text-heading: #1565c0;
      --shadow-color: rgba(0,0,0,0.1);
      --btn-bg: rgba(0,0,0,0.05);
      --btn-hover: rgba(0,0,0,0.15);
      --footer-color: rgba(84, 110, 122, 0.5);
      --dive-deep-bg: linear-gradient(90deg, #d32f2f 0%, #ef5350 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-body); color: var(--text-primary);
      font-family: 'Segoe UI', sans-serif; padding: 20px;
      min-height: 100vh; transition: background 0.3s, color 0.3s;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid var(--bg-header-border);
      padding-bottom: 15px; margin-bottom: 20px;
    }
    h1 { font-size: 2.5em; }
    .header-right { display: flex; align-items: center; gap: 20px; }
    .theme-toggle {
      background: var(--btn-bg); border: none; color: var(--text-primary);
      width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
      font-size: 1.8em; display: flex; align-items: center;
      justify-content: center; transition: all 0.3s ease;
    }
    .theme-toggle:hover { background: var(--btn-hover); }
    .datetime-container { text-align: right; }
    #clock { font-size: 2em; color: var(--text-accent); font-weight: bold; }
    #date { font-size: 1.1em; color: var(--text-secondary); margin-top: 4px; }
    .week-bar {
      background: linear-gradient(90deg, #1976d2 0%, #64b5f6 100%);
      color: white; padding: 14px 24px; border-radius: 10px; margin-bottom: 15px;
      display: grid; grid-template-columns: auto 1fr auto; gap: 20px;
      align-items: center; box-shadow: 0 4px 14px rgba(25, 118, 210, 0.35);
    }
    .week-bar-section-left { display: flex; align-items: center; gap: 15px; }
    .week-number {
      font-size: 2em; font-weight: bold; color: #fff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3); white-space: nowrap;
    }
    .week-range {
      font-size: 0.95em; color: #e3f2fd; background: rgba(255,255,255,0.18);
      padding: 6px 14px; border-radius: 20px; white-space: nowrap; font-weight: 600;
    }
    .week-bar-stats { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .stat-chip {
      background: rgba(255,255,255,0.18); padding: 8px 16px; border-radius: 25px;
      display: flex; align-items: center; gap: 8px; font-weight: 600;
    }
    .stat-chip-count { font-size: 1.4em; font-weight: bold; color: #fff; }
    .stat-chip-label {
      font-size: 0.9em; color: #e3f2fd; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .dive-deep-bar {
      background: var(--dive-deep-bg); color: var(--dive-deep-text);
      padding: 12px 20px; border-radius: 8px; margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(211, 47, 47, 0.4);
      animation: dive-deep-pulse 3s infinite; display: none;
    }
    .dive-deep-bar.visible { display: block; }
    @keyframes dive-deep-pulse {
      0%, 100% { box-shadow: 0 4px 12px rgba(211, 47, 47, 0.4); }
      50% { box-shadow: 0 4px 20px rgba(211, 47, 47, 0.7); }
    }
    .dive-deep-title {
      font-weight: bold; font-size: 1.05em; margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .dive-deep-tasks { font-size: 0.95em; line-height: 1.5; }
    .dive-deep-task-item {
      display: inline-block; background: rgba(255,255,255,0.2);
      padding: 4px 12px; margin: 3px 4px 3px 0; border-radius: 15px; font-weight: 600;
    }
    .dive-deep-task-item .owner { font-weight: normal; font-size: 0.9em; margin-left: 4px; }
    .board {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px; margin-bottom: 60px;
    }
    .category {
      background: var(--bg-category); border-radius: 12px; padding: 20px;
      box-shadow: 0 4px 12px var(--shadow-color);
    }
    .category h2 {
      color: var(--text-heading); margin-bottom: 15px;
      border-bottom: 1px solid var(--border-category); padding-bottom: 8px;
    }
    .task {
      background: var(--bg-task); border-left: 4px solid var(--text-accent);
      padding: 12px; margin-bottom: 10px; border-radius: 6px;
      transition: all 0.3s; display: flex; align-items: center; gap: 10px;
    }
    .task:hover { background: var(--bg-task-hover); }
    .task.done { text-decoration: line-through; border-left-color: #4caf50 !important; }
    .task.scaduta {
      background: linear-gradient(135deg, #4a0e0e 0%, var(--bg-task) 100%);
      border-left-color: #d32f2f !important; animation: pulse-red 2s infinite;
    }
    .task.imminente {
      background: linear-gradient(135deg, #4a3a0e 0%, var(--bg-task) 100%);
      border-left-color: #ffa726 !important;
    }
    .task.oggi {
      background: linear-gradient(135deg, #4a2a0e 0%, var(--bg-task) 100%);
      border-left-color: #ff5722 !important; animation: pulse-orange 3s infinite;
    }
    @keyframes pulse-red {
      0%, 100% { box-shadow: none; }
      50% { box-shadow: 0 0 20px rgba(211, 47, 47, 0.9); }
    }
    @keyframes pulse-orange {
      0%, 100% { box-shadow: none; }
      50% { box-shadow: 0 0 15px rgba(255, 87, 34, 0.7); }
    }
    .task-info { flex: 1; }
    .task-meta {
      font-size: 0.85em; color: var(--text-secondary); margin-top: 4px;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }
    .due-badge {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: 0.85em; font-weight: bold; margin-left: 4px;
    }
    .due-badge.normale { background: #37474f; color: #b0bec5; }
    .due-badge.imminente { background: #ffa726; color: #000; }
    .due-badge.oggi { background: #ff5722; color: #fff; }
    .due-badge.scaduta { background: #d32f2f; color: #fff; }
    .cadenza-badge {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: 0.85em; font-weight: bold; background: #5c6bc0; color: #fff;
    }
    .cadenza-badge.weekly { background: #26a69a; }
    .cadenza-badge.monthly { background: #7e57c2; }
    .cadenza-badge.biweekly { background: #ec407a; }
    .cadenza-badge.daily { background: #ef5350; }
    .cadenza-badge.quarterly { background: #66bb6a; }
    .cadenza-badge.yearly { background: #ff7043; }
    .checkbox { width: 22px; height: 22px; cursor: pointer; }
    #status { color: #f44336; margin: 20px 0; }
    .loading { text-align: center; padding: 40px; color: var(--text-accent); }
    .alerts { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .alert-card {
      background: var(--bg-summary-card); padding: 10px 20px; border-radius: 8px;
      display: flex; align-items: center; gap: 10px; font-size: 0.95em;
      box-shadow: 0 2px 6px var(--shadow-color);
    }
    .alert-card.critical { border-left: 4px solid #d32f2f; }
    .alert-card.warning { border-left: 4px solid #ffa726; }
    .alert-count { font-size: 1.5em; font-weight: bold; }
    .author-signature {
      position: fixed; bottom: 12px; right: 18px; font-size: 0.8em;
      color: var(--footer-color); font-style: italic; letter-spacing: 0.5px;
      pointer-events: none; user-select: none; z-index: 100;
    }
  </style>
</head>
<body>

  <header>
    <h1>📋 Team Task Board</h1>
    <div class="header-right">
      <div class="datetime-container">
        <div id="clock">--:--:--</div>
        <div id="date">-- ------ ----</div>
      </div>
      <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>
  </header>

  <div class="week-bar">
    <div class="week-bar-section-left">
      <span class="week-number" id="weekNumber">WK --</span>
      <span class="week-range" id="weekRange">--</span>
    </div>
    <div class="week-bar-stats" id="weekStats">
      <div class="stat-chip">
        <span class="stat-chip-count" id="statAperte">--</span>
        <span class="stat-chip-label">📋 Aperte</span>
      </div>
      <div class="stat-chip">
        <span class="stat-chip-count" id="statCompletate">--</span>
        <span class="stat-chip-label">✅ Completate</span>
      </div>
    </div>
  </div>

  <div class="alerts" id="alerts"></div>

  <div id="status"></div>

  <div class="dive-deep-bar" id="diveDeepBar">
    <div class="dive-deep-title" id="diveDeepTitle">Dive Deep WK --:</div>
    <div class="dive-deep-tasks" id="diveDeepTasks">⏳ Caricamento tasks...</div>
  </div>

  <div class="board" id="board">
    <div class="loading">⏳ Caricamento...</div>
  </div>

  <div class="author-signature">Versione 2.0 by [sbartocc]</div>

  <script>
    // =============================================
    // ⚠️ SOSTITUISCI con l'URL del TUO Apps Script
    // =============================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbyY5EXp2_xRdGLe2POmk4Drs67-VtdmdR-nKIwNLnlRus1WOBijdNEONdc2MPT0upmm/exec';
    const AUTO_REFRESH_MS = 30000;
    const GIORNI_IMMINENTE = 3;
    const GIORNI_OGGI = 1;

    // CALIBRAZIONE WEEK NUMBER (deve matchare Apps Script)
    const WEEKREFERENCEDATE = new Date(2026, 8, 27);
    const WEEKREFERENCENUMBER = 40;

    let isUpdating = false;

    // === THEME ===
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      applyTheme(savedTheme);
      document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    }
    function toggleTheme() {
      const curr = document.body.classList.contains('light-mode') ? 'light' : 'dark';
      applyTheme(curr === 'dark' ? 'light' : 'dark');
    }
    function applyTheme(theme) {
      const btn = document.getElementById('themeToggle');
      if (theme === 'light') {
        document.body.classList.add('light-mode');
        btn.textContent = '☀️';
      } else {
        document.body.classList.remove('light-mode');
        btn.textContent = '🌙';
      }
      localStorage.setItem('theme', theme);
    }

    // === WEEK NUMBER ===
    function getWeekNumber(date) {
      const target = new Date(date.valueOf());
      target.setHours(0, 0, 0, 0);
      const reference = new Date(WEEKREFERENCEDATE.valueOf());
      reference.setHours(0, 0, 0, 0);
      const diffDays = Math.round((target - reference) / (1000 * 60 * 60 * 24));
      const dayOfWeek = target.getDay();
      const weeksDiff = Math.floor((diffDays - dayOfWeek) / 7);
      return WEEKREFERENCENUMBER + weeksDiff;
    }

    function getWeekRange(date) {
      const current = new Date(date.valueOf());
      current.setHours(0, 0, 0, 0);
      const sunday = new Date(current);
      sunday.setDate(current.getDate() - current.getDay());
      const saturday = new Date(sunday);
      saturday.setDate(sunday.getDate() + 6);
      const fmt = (d) => `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      return `${fmt(sunday)} → ${fmt(saturday)}`;
    }

    // === DATE TIME ===
    function updateDateTime() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('it-IT');
      document.getElementById('date').textContent = now.toLocaleDateString('it-IT', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
      document.getElementById('weekNumber').textContent = 'WK ' + getWeekNumber(now);
      document.getElementById('weekRange').textContent = getWeekRange(now);
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // === HELPERS ===
    function getCadenzaClass(c) {
      if (!c) return '';
      const n = String(c).toLowerCase().trim();
      if (n === 'weekly') return 'weekly';
      if (n === 'monthly') return 'monthly';
      if (n === 'bi-weekly' || n === 'biweekly') return 'biweekly';
      if (n === 'daily') return 'daily';
      if (n === 'quarterly') return 'quarterly';
      if (n === 'yearly' || n === 'annual') return 'yearly';
      return '';
    }

    function formatDataDDMM(ds) {
      if (!ds) return '';
      const d = new Date(ds);
      if (isNaN(d.getTime())) return '';
      return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function calcolaGiorniMancanti(s) {
      if (!s) return null;
      const d = new Date(s);
      if (isNaN(d.getTime())) return null;
      const oggi = new Date();
      oggi.setHours(0, 0, 0, 0);
      d.setHours(0, 0, 0, 0);
      return Math.round((d - oggi) / (1000 * 60 * 60 * 24));
    }

    function getScadenzaClass(g, done) {
      if (done || g === null) return '';
      if (g < 0) return 'scaduta';
      if (g <= GIORNI_OGGI) return 'oggi';
      if (g <= GIORNI_IMMINENTE) return 'imminente';
      return '';
    }

    function getScadenzaBadge(g, scadenza, done) {
      const d = formatDataDDMM(scadenza);
      if (done) return `<span class="due-badge normale">📅 ${d}</span>`;
      if (g === null) return '';
      let c = 'normale', t = `📅 ${d}`;
      if (g < 0) { c = 'scaduta'; t = `⚠️ Scaduta (${d})`; }
      else if (g === 0) { c = 'oggi'; t = `🔥 OGGI (${d})`; }
      else if (g === 1) { c = 'oggi'; t = `⏰ Domani (${d})`; }
      else if (g <= GIORNI_IMMINENTE) { c = 'imminente'; t = `⏳ ${g}g (${d})`; }
      return `<span class="due-badge ${c}">${t}</span>`;
    }

    // === LOAD TASKS ===
    async function loadTasks() {
      if (isUpdating) return;
      try {
        const res = await fetch(API_URL);
        const json = await res.json();
        if (json.status === 'ok') {
          renderBoard(json.data);
          updateWeekStats(json.data);
          updateAlerts(json.data);
          updateDiveDeep(json.data);
        } else {
          showError('Errore: ' + json.message);
        }
      } catch (err) {
        showError('Errore caricamento: ' + err.message);
      }
    }

    // === STATS ===
    function updateWeekStats(tasks) {
      let aperte = 0, completate = 0;
      tasks.forEach(t => {
        const d = t.Stato === true || t.Stato === 'TRUE' || t.Stato === 'VERO' || t.Stato === 1;
        if (d) completate++;
        else aperte++;
      });
      document.getElementById('statAperte').textContent = aperte;
      document.getElementById('statCompletate').textContent = completate;
    }

    // === ALERTS ===
    function updateAlerts(tasks) {
      let scadute = 0, imminenti = 0, oggi = 0;
      tasks.forEach(t => {
        const d = t.Stato === true || t.Stato === 'TRUE' || t.Stato === 'VERO' || t.Stato === 1;
        if (d) return;
        const g = calcolaGiorniMancanti(t.Scadenza);
        if (g === null) return;
        if (g < 0) scadute++;
        else if (g <= GIORNI_OGGI) oggi++;
        else if (g <= GIORNI_IMMINENTE) imminenti++;
      });
      let html = '';
      if (scadute > 0) html += `<div class="alert-card critical"><span class="alert-count">🚨 ${scadute}</span> Scadute</div>`;
      if (oggi > 0) html += `<div class="alert-card critical"><span class="alert-count">⏰ ${oggi}</span> Oggi/Domani</div>`;
      if (imminenti > 0) html += `<div class="alert-card warning"><span class="alert-count">⚠️ ${imminenti}</span> Imminenti (${GIORNI_IMMINENTE}g)</div>`;
      document.getElementById('alerts').innerHTML = html;
    }

    // === DIVE DEEP ===
    function updateDiveDeep(tasks) {
      const bar = document.getElementById('diveDeepBar');
      const title = document.getElementById('diveDeepTitle');
      const container = document.getElementById('diveDeepTasks');
      const previousWK = getWeekNumber(new Date()) - 1;

      const scadute = tasks.filter(t => {
        const d = t.Stato === true || t.Stato === 'TRUE' || t.Stato === 'VERO' || t.Stato === 1;
        if (d) return false;
        const s = String(t.StoricoScadute || '').trim();
        if (!s) return false;
        const wks = s.split(',').map(x => parseInt(x.trim())).filter(n => !isNaN(n));
        return wks.includes(previousWK);
      });

      if (scadute.length === 0) {
        bar.classList.remove('visible');
        return;
      }

      bar.classList.add('visible');
      title.textContent = `Dive Deep WK ${previousWK} - ${scadute.length} ${scadute.length === 1 ? 'task non completata' : 'task non completate'}:`;
      container.innerHTML = scadute.map(t =>
        `<span class="dive-deep-task-item">${t.Task || 'Senza nome'}<span class="owner">(${t.Assegnato || 'N/A'})</span></span>`
      ).join(' ');
    }

    // === RENDER BOARD ===
    function renderBoard(tasks) {
      const board = document.getElementById('board');
      board.innerHTML = '';

      if (!tasks || tasks.length === 0) {
        board.innerHTML = '<div class="loading">📭 Nessuna task</div>';
        return;
      }

      const cats = {};
      tasks.forEach(t => {
        const c = t.Categoria || 'Altro';
        if (!cats[c]) cats[c] = [];
        cats[c].push(t);
      });

      Object.keys(cats).sort().forEach(cat => {
        const div = document.createElement('div');
        div.className = 'category';
        div.innerHTML = `<h2>${cat}</h2>`;

        cats[cat].sort((a, b) => {
          const ga = calcolaGiorniMancanti(a.Scadenza);
          const gb = calcolaGiorniMancanti(b.Scadenza);
          const da = a.Stato === true || a.Stato === 'TRUE' || a.Stato === 'VERO';
          const db = b.Stato === true || b.Stato === 'TRUE' || b.Stato === 'VERO';
          if (da !== db) return da ? 1 : -1;
          if (ga === null && gb !== null) return 1;
          if (ga !== null && gb === null) return -1;
          if (ga !== null && gb !== null) return ga - gb;
          return 0;
        }).forEach(t => {
          const done = t.Stato === true || t.Stato === 'TRUE' || t.Stato === 'VERO'
            || t.Stato === 1 || String(t.Stato).toLowerCase() === 'true'
            || String(t.Stato).toLowerCase() === 'vero';
          const cad = t.Cadenza || '';
          const cc = getCadenzaClass(cad);
          const g = calcolaGiorniMancanti(t.Scadenza);
          const sc = getScadenzaClass(g, done);
          const sb = getScadenzaBadge(g, t.Scadenza, done);

          const el = document.createElement('div');
          el.className = `task ${done ? 'done' : ''} ${sc}`;
          el.innerHTML = `
            <input type="checkbox" class="checkbox" ${done ? 'checked' : ''}
              onchange="toggleTask('${t.ID}', this.checked, this)">
            <div class="task-info">
              <strong>${t.Task || 'Senza descrizione'}</strong>
              <div class="task-meta">
                <span>👤 ${t.Assegnato || 'N/A'}</span>
                ${cad ? `<span class="cadenza-badge ${cc}">🔄 ${cad}</span>` : ''}
                ${sb}
              </div>
            </div>
          `;
          div.appendChild(el);
        });

        board.appendChild(div);
      });
    }

    // === TOGGLE TASK ===
    async function toggleTask(id, completed, checkbox) {
      isUpdating = true;
      checkbox.disabled = true;
      try {
        const r = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ id: id, completed: completed })
        });
        const res = await r.json();
        if (res.status === 'ok') {
          const el = checkbox.closest('.task');
          if (completed) {
            el.classList.add('done');
            el.classList.remove('scaduta', 'imminente', 'oggi');
          } else {
            el.classList.remove('done');
          }
          setTimeout(loadTasks, 1000);
        } else {
          showError('Errore: ' + res.message);
          checkbox.checked = !completed;
        }
      } catch (err) {
        showError('Errore: ' + err.message);
        checkbox.checked = !completed;
      } finally {
        checkbox.disabled = false;
        isUpdating = false;
      }
    }

    // === ERROR ===
    function showError(msg) {
      document.getElementById('status').textContent = msg;
      setTimeout(() => document.getElementById('status').textContent = '', 5000);
    }

    // === INIT ===
    initTheme();
    loadTasks();
    setInterval(loadTasks, AUTO_REFRESH_MS);
  </script>

</body>
</html>
